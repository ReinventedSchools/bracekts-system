name: Desplegar al servidor

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar la carpeta en el servidor
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR != '' && secrets.VPS_APP_DIR || '/var/www/bracekts-system' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          envs: APP_DIR
          script: mkdir -p "$APP_DIR"

      - name: Copiar la aplicación
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          source: "package.json,package-lock.json,ecosystem.config.cjs,server,public,sql,scripts"
          target: ${{ secrets.VPS_APP_DIR != '' && secrets.VPS_APP_DIR || '/var/www/bracekts-system' }}
          overwrite: true

      - name: Instalar dependencias y reiniciar
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR != '' && secrets.VPS_APP_DIR || '/var/www/bracekts-system' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          TRUST_PROXY: ${{ secrets.TRUST_PROXY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          envs: APP_DIR,SESSION_SECRET,ADMIN_NAME,ADMIN_EMAIL,ADMIN_PASSWORD,DB_USER,DB_PASSWORD,DB_NAME,COOKIE_SECURE,TRUST_PROXY
          script: |
            cd "$APP_DIR"
            sed -i 's/\r$//' scripts/remote-deploy.sh
            bash scripts/remote-deploy.sh
