name: Revisar servidor

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Leer el servidor sin modificarlo
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          script: |
            set +e
            echo "=== identidad ==="
            whoami
            hostname
            . /etc/os-release
            echo "$PRETTY_NAME"
            echo "=== disco ==="
            df -h /
            echo "=== puertos ==="
            ss -tlnp 2>/dev/null || netstat -tlnp
            echo "=== programas ==="
            command -v nginx && nginx -v
            command -v apache2 && apache2 -v
            command -v caddy && caddy version
            command -v node && node -v
            command -v npm && npm -v
            command -v pm2 && pm2 -v
            command -v docker && docker --version
            echo "=== sitios web ==="
            ls -la /etc/nginx/sites-enabled 2>/dev/null
            ls -la /etc/nginx/conf.d 2>/dev/null
            ls -la /etc/apache2/sites-enabled 2>/dev/null
            echo "=== server_name ==="
            grep -R --include='*.conf' -n "server_name" /etc/nginx /etc/apache2 /etc/caddy 2>/dev/null
            echo "=== www ==="
            ls -la /var/www 2>/dev/null
            echo "=== carpeta prevista ==="
            if [ -e /var/www/bracekts-system ]; then ls -la /var/www/bracekts-system; else echo "no existe /var/www/bracekts-system"; fi
            echo "=== certificados ==="
            ls /etc/letsencrypt/live 2>/dev/null
            echo "=== pm2 ==="
            pm2 ls 2>/dev/null
            echo "=== docker ==="
            docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null
            echo "=== fin ==="
